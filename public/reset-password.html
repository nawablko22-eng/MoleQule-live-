<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — MoleQule Prep</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="container row between">
    <a class="brand" href="/home.html"><span class="dot"></span> MoleQule Prep</a>
  </div>
</header>

<main class="container" style="max-width:420px;">
  <div class="card">
    <h2>Set a new password</h2>
    <div id="invalid-link" class="notice error" style="display:none;">
      This reset link is missing or malformed. <a href="/index.html">Go back to log in</a> and use "Forgot password?" again.
    </div>
    <form id="reset-form">
      <label>New password</label>
      <input name="password" type="password" required minlength="6" placeholder="At least 6 characters">
      <label>Confirm new password</label>
      <input name="confirm" type="password" required minlength="6">
      <div id="reset-error" class="notice error" style="display:none;"></div>
      <button style="margin-top:16px;width:100%;justify-content:center;">Reset password</button>
    </form>
    <div id="reset-success" class="notice info" style="display:none;">
      Your password's been reset. <a href="/index.html">Log in</a> with your new password.
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script>
const token = new URLSearchParams(location.search).get("token");
const form = document.getElementById("reset-form");
if (!token) {
  document.getElementById("invalid-link").style.display = "block";
  form.style.display = "none";
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const errEl = document.getElementById("reset-error");
  errEl.style.display = "none";
  const password = fd.get("password");
  if (password !== fd.get("confirm")) {
    errEl.textContent = "Passwords don't match.";
    errEl.style.display = "block";
    return;
  }
  try {
    await api("/auth/reset-password", { method: "POST", body: { token, password } });
    form.style.display = "none";
    document.getElementById("reset-success").style.display = "block";
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = "block";
  }
};
</script>
</body>
</html>
